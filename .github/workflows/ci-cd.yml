# CI/CD del frontend (Hito 4): Build → Compile → Test → Deploy a Vercel
# - En cada PR hacia main: instala, compila (tsc) y construye (vite). No despliega.
# - En cada push/merge a main: lo mismo y, si pasa, despliega a producción en Vercel.
# Requiere el secret VERCEL_TOKEN en el repo (Settings → Secrets and variables → Actions).
# - Ejecución manual (Actions → CI/CD Frontend → Run workflow), con la casilla simular_error:
#   · desmarcada: instala, compila, prueba y, desde main, despliega igual que un push.
#   · marcada: instala, compila y prueba igual (el código no se toca), luego un paso hace exit 1 a propósito;
#     el build queda en rojo y el deploy NO se ejecuta (depende de needs: build). Sirve para demostrar
#     que un fallo nunca llega a producción.

name: CI/CD Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      simular_error:
        description: "Genera un fallo controlado para la demostración académica."
        type: boolean
        default: false

env:
  VERCEL_ORG_ID: team_0djkkuY2CsvooLgPdDR43lyy
  VERCEL_PROJECT_ID: prj_hEy5mFw2NnSW3ZaGhIsNRLokwUbS

jobs:
  build:
    name: Build, Compile y Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar y construir (tsc -b && vite build)
        run: npm run build

      - name: Tests
        run: npm test --if-present

      # Solo en ejecución manual con simular_error marcado; en push y PR inputs llega vacío y se salta
      - name: Fallo controlado (simular_error)
        if: ${{ inputs.simular_error == true }}
        run: |
          echo "::error title=Fallo simulado::Error forzado a propósito para la demostración; el código y las pruebas no se modificaron."
          exit 1

  deploy:
    name: Deploy a Vercel (producción)
    needs: build
    # needs: build es la barrera: si el build falla (también el fallo simulado), no se despliega
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Traer configuración y variables de entorno de Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build para Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
