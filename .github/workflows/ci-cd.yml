# CI/CD del frontend (Hito 4) + revisión de seguridad (Hito 5)
#
#   Tipos y compilación (tsc) ─┐
#   Pruebas unitarias (vitest) ┴─> Build (vite) ─┐
#   Seguridad · Dependencias (npm audit) ────────┤
#   Seguridad · Secretos (gitleaks) ─────────────┼─> CI frontend verde ─> Deploy a Vercel ─> Verificar producción ─> Versionado
#   Seguridad · SAST (CodeQL) ───────────────────┤
#   Calcular versión ────────────────────────────┘
#
# Revisión de seguridad (DevSecOps). Cualquiera de estos hallazgos pone el pipeline en rojo, así que no hay deploy ni versión:
#   - Dependencias: npm audit bloquea vulnerabilidades HIGH o CRITICAL en las librerías que llegan al navegador
#     (dependencies). Las de desarrollo (devDependencies) se reportan sin bloquear: no se publican.
#   - Secretos: gitleaks revisa TODO el historial de git (tokens de Vercel/G7, contraseñas, llaves).
#   - SAST: CodeQL analiza el código TypeScript/React (XSS, redirecciones abiertas, etc.). Bloquea severidad alta o
#     crítica (security-severity >= 7.0). Los resultados se publican en Security > Code scanning.
#   - Producción: además de responder 200, se verifican las cabeceras de seguridad que define vercel.json.
#
# - PR hacia main: tipos, pruebas, build y versión calculada (se comenta en el PR). No despliega ni crea versión.
# - Push/merge a main: todo lo anterior y, si pasa, despliega en Vercel, verifica producción y publica la versión.
# - Versionado semántico automático (Conventional Commits, ver .github/scripts/calcular-version.sh):
#   feat -> minor, fix/perf/refactor -> patch, "!" o BREAKING CHANGE -> major, docs/ci/chore -> sin versión.
#   La versión es el ÚLTIMO paso: si algo falla (tipos, pruebas, build, simular_error, deploy o verificación), no se crea.
# - Ejecución manual (Actions > CI/CD Frontend > Run workflow), con la casilla simular_error:
#   · desmarcada: igual que un push (desde main despliega y versiona).
#   · marcada: todo se prueba igual, pero la barrera "CI frontend verde" falla a propósito; no hay deploy ni versión.
# Requiere el secret VERCEL_TOKEN (Settings > Secrets and variables > Actions).

name: CI/CD Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      simular_error:
        description: "Genera un fallo controlado para la demostración académica."
        type: boolean
        default: false

# Dos ejecuciones seguidas de main esperan su turno (no se pisan al crear versiones)
concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_0djkkuY2CsvooLgPdDR43lyy
  VERCEL_PROJECT_ID: prj_hEy5mFw2NnSW3ZaGhIsNRLokwUbS
  URL_PRODUCCION: https://g5-ventas-postventas-frontend.vercel.app

jobs:
  tipos:
    name: Tipos y compilación (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar tipos (tsc -b)
        run: npx tsc -b

  pruebas:
    name: Pruebas unitarias (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas
        run: npm test

  calcular-version:
    name: Calcular versión
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      anterior: ${{ steps.version.outputs.anterior }}
      siguiente: ${{ steps.version.outputs.siguiente }}
      tipo: ${{ steps.version.outputs.tipo }}
      publicar: ${{ steps.version.outputs.publicar }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Calcular siguiente versión (SemVer)
        id: version
        run: bash .github/scripts/calcular-version.sh

      - name: Comentar la versión en el PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ANTERIOR: ${{ steps.version.outputs.anterior }}
          SIGUIENTE: ${{ steps.version.outputs.siguiente }}
          TIPO: ${{ steps.version.outputs.tipo }}
          PUBLICAR: ${{ steps.version.outputs.publicar }}
        run: |
          if [ "$PUBLICAR" = "true" ]; then
            cuerpo="**Versión del frontend:** \`$ANTERIOR\` → \`$SIGUIENTE\` (cambio **$TIPO**). Se publicará al fusionar en \`main\` si el pipeline termina en verde."
          else
            cuerpo="**Versión del frontend:** se mantiene en \`$ANTERIOR\` (solo hay cambios de docs/ci/chore/test)."
          fi
          gh pr comment "$PR" --edit-last --body "$cuerpo" 2>/dev/null || gh pr comment "$PR" --body "$cuerpo"

  build:
    name: Build (vite)
    needs: [tipos, pruebas]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Construir (vite build)
        run: npx vite build
      - name: Guardar el build (dist)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  seguridad-dependencias:
    name: Seguridad · Dependencias (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Reporte completo (incluye devDependencies, informativo)
        run: |
          npm audit --json > npm-audit.json || true
          { echo "### npm audit (todas las dependencias)"; echo '```'; npm audit || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Bloquear HIGH o CRITICAL en dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seguridad-dependencias
          path: npm-audit.json
          if-no-files-found: ignore
          retention-days: 14

  seguridad-secretos:
    name: Seguridad · Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # todo el historial: un secreto borrado en un commit posterior igual queda expuesto

      - name: Instalar gitleaks
        env:
          VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks" version

      - name: Buscar secretos en el historial
        run: gitleaks git . --redact --verbose --report-format json --report-path gitleaks.json

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seguridad-secretos
          path: gitleaks.json
          if-no-files-found: ignore
          retention-days: 14

  seguridad-sast:
    name: Seguridad · SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # publicar resultados en Security > Code scanning
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analizar
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          output: codeql-resultados

      - name: Bloquear hallazgos de severidad alta o crítica
        run: |
          sarif="$(ls codeql-resultados/*.sarif | head -1)"
          jq -r '
            .runs[] as $run
            | ($run.tool.driver.rules // []) as $reglas
            | $run.results[]
            | . as $r
            | ([$reglas[] | select(.id == $r.ruleId)][0].properties["security-severity"] // "0" | tonumber) as $sev
            | select($sev >= 7.0)
            | "\($sev)\t\($r.ruleId)\t\($r.locations[0].physicalLocation.artifactLocation.uri):\($r.locations[0].physicalLocation.region.startLine)"
          ' "$sarif" > altos.tsv
          total="$(jq '[.runs[].results[]] | length' "$sarif")"
          altos="$(wc -l < altos.tsv)"
          { echo "### CodeQL · TypeScript/React"; echo "Hallazgos totales: $total · Altos/críticos (bloquean): $altos"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$altos" -gt 0 ]; then
            { echo '```'; cat altos.tsv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=SAST::CodeQL encontró $altos hallazgo(s) de severidad alta o crítica (ver resumen y Security > Code scanning)."
            exit 1
          fi

      - name: Guardar reporte SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seguridad-sast
          path: codeql-resultados/
          if-no-files-found: ignore
          retention-days: 14

  ci-verde:
    name: CI frontend verde
    needs: [tipos, pruebas, build, calcular-version, seguridad-dependencias, seguridad-secretos, seguridad-sast]
    # always(): este check SIEMPRE se reporta (rojo si algo falló). Un check "saltado" contaría como aprobado
    # en la protección de rama, por eso no se deja saltar.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que todos los jobs pasaron
        env:
          TIPOS: ${{ needs.tipos.result }}
          PRUEBAS: ${{ needs.pruebas.result }}
          BUILD: ${{ needs.build.result }}
          VERSION: ${{ needs.calcular-version.result }}
          DEPENDENCIAS: ${{ needs.seguridad-dependencias.result }}
          SECRETOS: ${{ needs.seguridad-secretos.result }}
          SAST: ${{ needs.seguridad-sast.result }}
        run: |
          echo "Tipos: $TIPOS | Pruebas: $PRUEBAS | Build: $BUILD | Versión: $VERSION"
          echo "Seguridad -> Dependencias: $DEPENDENCIAS | Secretos: $SECRETOS | SAST: $SAST"
          for r in "$TIPOS" "$PRUEBAS" "$BUILD" "$VERSION" "$DEPENDENCIAS" "$SECRETOS" "$SAST"; do
            if [ "$r" != "success" ]; then
              echo "::error title=CI en rojo::Al menos un job (tipos, pruebas, build o revisión de seguridad) falló; no se despliega ni se crea versión."
              exit 1
            fi
          done

      # Solo en ejecución manual con simular_error marcado; en push y PR inputs llega vacío y se salta
      - name: Fallo controlado (simular_error)
        if: ${{ inputs.simular_error == true }}
        run: |
          echo "::error title=Fallo simulado::Error forzado a propósito para la demostración; el código y las pruebas no se modificaron."
          exit 1

  deploy:
    name: Deploy a Vercel (producción)
    needs: ci-verde
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar Vercel CLI
        run: npm install --global vercel@65

      - name: Traer configuración y variables de entorno de Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build para Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  verificar-produccion:
    name: Verificar producción
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: La página principal responde 200 y sirve la app
        run: |
          for intento in $(seq 1 10); do
            codigo="$(curl -s -o pagina.html -w '%{http_code}' --max-time 20 "$URL_PRODUCCION/")"
            if [ "$codigo" = "200" ] && grep -q 'id="root"' pagina.html; then
              echo "$URL_PRODUCCION responde 200 (intento $intento)"; exit 0
            fi
            echo "Intento $intento: código $codigo, reintentando en 10 s..."; sleep 10
          done
          echo "::error::$URL_PRODUCCION no respondió correctamente"; exit 1

      # vercel.json reescribe todas las rutas a index.html: una ruta interna también debe responder 200
      - name: Una ruta interna del portal responde 200
        run: |
          codigo="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL_PRODUCCION/admin/dashboard")"
          echo "GET /admin/dashboard -> $codigo"
          [ "$codigo" = "200" ] || { echo "::error::Se esperaba 200 y se obtuvo $codigo"; exit 1; }

      # Cabeceras definidas en vercel.json (clickjacking, MIME sniffing, fuga de referer, permisos del navegador)
      - name: Cabeceras de seguridad presentes
        run: |
          curl -sSI --max-time 20 "$URL_PRODUCCION/" | tr -d '\r' > cabeceras.txt
          falta=0
          for c in "strict-transport-security" "x-content-type-options: nosniff" "x-frame-options: DENY" \
                   "referrer-policy: strict-origin-when-cross-origin" "permissions-policy"; do
            if grep -qi "^$c" cabeceras.txt; then echo "OK  $c"; else echo "::error::Falta la cabecera $c"; falta=1; fi
          done
          exit $falta

  versionado:
    name: Versionado (tag + Release)
    needs: [calcular-version, verificar-produccion]
    if: needs.calcular-version.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Crear tag y GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.calcular-version.outputs.siguiente }}
          TIPO: ${{ needs.calcular-version.outputs.tipo }}
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "Frontend $VERSION" --generate-notes
          echo "### Versión publicada: \`$VERSION\` ($TIPO)" >> "$GITHUB_STEP_SUMMARY"
